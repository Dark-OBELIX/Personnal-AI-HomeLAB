# Homelab IA — version 2 (simplifiée)
# Ubuntu + Docker + Tailscale installé sur l'hôte, ufw actif.
#
#   homeassistant  domotique, réseau de l'hôte
#   mosquitto      broker MQTT (bandeau LED, objets ESP32), réseau de l'hôte
#   ollama         modèle local qwen3:4b sur le CPU
#   postgres       repas, eau, poids, données Garmin
#   assistant      bot Discord (profil "bot", à activer quand le code existe)
#
# Docker contourne ufw pour les ports publiés : rien n'est publié sur 0.0.0.0.
# Accès à distance à Home Assistant : `sudo tailscale serve --bg --tls-terminated-tcp=443 tcp://localhost:8123`

name: homelab

services:

  # ── Domotique ──
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host            # découverte mDNS, ESPHome, Matter
    environment:
      TZ: ${TZ}
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro    # Bluetooth (optionnel)
    # Clé Zigbee : décommenter et remplacer par le chemin donné par `ls -l /dev/serial/by-id/`
    # devices:
    #   - /dev/serial/by-id/usb-XXXX:/dev/ttyUSB0

  # ── Broker MQTT (bandeau LED, objets ESP32) ──
  # Réseau de l'hôte : joignable par les ESP sur 192.168.1.111:1883 (règle ufw dans le README),
  # et par Home Assistant sur localhost:1883.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    network_mode: host
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    # Le fichier de mots de passe est régénéré à chaque démarrage depuis le .env
    command: >
      sh -c 'mosquitto_passwd -c -b /mosquitto/data/passwd "$$MQTT_USER" "$$MQTT_PASSWORD"
      && chown mosquitto:mosquitto /mosquitto/data/passwd
      && chmod 0700 /mosquitto/data/passwd
      && exec mosquitto -c /mosquitto/config/mosquitto.conf'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  # ── Modèle local (CPU) ──
  ollama:
    image: ollama/ollama:latest   # épingle une version précise une fois validée
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"   # pour tester depuis le serveur ; le bot passe par le réseau Docker
    environment:
      OLLAMA_KEEP_ALIVE: 24h        # garde le modèle en mémoire : pas de rechargement à chaque message
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1        # une requête à la fois : le CPU ne suit pas plus
      OLLAMA_CONTEXT_LENGTH: 4096   # contexte limité pour tenir dans 8 Go
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0    # divise par deux la mémoire du contexte
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 5g                   # protège Home Assistant et PostgreSQL si le modèle déborde
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Base de données ──
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Bot Discord (à activer quand ./assistant existe) ──
  #   docker compose --profile bot up -d
  assistant:
    profiles: ["bot"]
    build: ./assistant
    container_name: assistant
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HA_URL: http://host.docker.internal:8123
      HA_TOKEN: ${HA_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Home Assistant est sur le réseau de l'hôte
    volumes:
      - assistant_data:/data                  # jetons Google et Garmin (chiffrés)
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

# Sous-réseau fixe : permet une règle ufw précise pour que le bot joigne Home Assistant
#   sudo ufw allow from 172.30.0.0/24 to any port 8123 proto tcp
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  mosquitto_data:
  ollama_data:
  postgres_data:
  assistant_data:
