# Broker MQTT du homelab (Home Assistant, bandeau LED, futurs objets ESP32)
# Le fichier de mots de passe est généré au démarrage depuis MQTT_USER / MQTT_PASSWORD (.env).

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
